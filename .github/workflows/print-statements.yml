
name: Print Two Statements

on:
  workflow_dispatch:

jobs:
  job1:
    name: First Job
    runs-on: ubuntu-latest
    steps:
      - name: Print first statement
        run: echo "Hello, GitHub Actions!"

  job2:
    name: Second Job
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Print second statement
        run: echo "My name is Abdullah"
